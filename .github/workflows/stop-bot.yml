name: Stop Railway Bot

on:
  schedule:
    # 02:00 UTC (dia seguinte) = 23:00 BRT (horário de Brasília, UTC-3)
    - cron: '0 2 * * *'
  workflow_dispatch: {} # permite rodar manualmente também

jobs:
  stop-service:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest deployment ID
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        id: get_deployment
        run: |
          RESPONSE=$(curl --silent --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "query": "query { deployments(input: { serviceId: \"f6bcfdb1-96e6-47d8-85d2-986977a68dac\", environmentId: \"910f5d26-f005-4426-95b4-2d65f866269c\" }, first: 1) { edges { node { id status } } } }"
            }')
          echo "Response: $RESPONSE"
          DEPLOYMENT_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Stop deployment
        if: steps.get_deployment.outputs.deployment_id != ''
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          curl --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{
              \"query\": \"mutation { deploymentStop(id: \\\"${{ steps.get_deployment.outputs.deployment_id }}\\\") }\"
            }"
